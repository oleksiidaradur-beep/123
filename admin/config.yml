backend:
  name: git-gateway
  branch: claude/design-opsis-landing-W0pv3

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "nb_NO"

collections:

  # ── PORTEFØLJE ─────────────────────────────────────────────────────────────
  - name: "portfolio"
    label: "Portefølje"
    label_singular: "Prosjekt"
    files:
      - name: "projects"
        label: "Alle prosjekter"
        file: "data/portfolio.json"
        fields:
          - name: projects
            label: Prosjekter
            label_singular: Prosjekt
            widget: list
            summary: "{{fields.title}} — {{fields.client}}"
            fields:
              - { label: "ID",      name: id,     widget: number,  hint: "Unik tallkode — bare øk med 1 fra siste" }
              - label: "Kategori"
                name: cat
                widget: select
                options:
                  - { label: "Skilt & storformat", value: "skilt" }
                  - { label: "Bilfoliering",       value: "bil"   }
                  - { label: "Profilklær",          value: "klaer" }
                  - { label: "Grafisk design",      value: "design"}
                  - { label: "Trykksaker",          value: "trykk" }
                  - { label: "Interiørdekor",       value: "dekor" }
                  - { label: "Messeutstyr",         value: "messe" }
              - label: "Kortstørrelse"
                name: size
                widget: select
                default: "standard"
                options:
                  - { label: "Standard (1×1)",        value: "standard" }
                  - { label: "Bred (2×1)",            value: "wide"     }
                  - { label: "Høy (1×2)",             value: "tall"     }
                  - { label: "Feature/Stor (2×2)",    value: "feature"  }
              - { label: "Prosjekttittel",  name: title,  widget: string }
              - { label: "Kundenavn",       name: client, widget: string }
              - { label: "Beskrivelse",     name: desc,   widget: text   }
              - label: "Bilde"
                name: img
                widget: image
                hint: "Last opp bilde eller lim inn URL fra Unsplash"
                choose_url: true
                media_library:
                  config:
                    multiple: false

  # ── PRISER ─────────────────────────────────────────────────────────────────
  - name: "pricing"
    label: "Priser"
    files:
      - name: "alle_priser"
        label: "Alle priser"
        file: "data/pricing.json"
        fields:

          - name: skilt
            label: "Skilt og storformat"
            widget: object
            fields:
              - { label: "Monteringskostnad (NOK)", name: setup, widget: number }
              - label: "Materialer"
                name: materials
                widget: list
                summary: "{{fields.label}} — {{fields.pricePerM2}} NOK/m²"
                fields:
                  - { label: "ID",          name: id,         widget: string }
                  - { label: "Navn",        name: label,      widget: string }
                  - { label: "Pris per m²", name: pricePerM2, widget: number }

          - name: produkter
            label: "Produkter og klær"
            widget: object
            fields:
              - label: "Produkter"
                name: products
                widget: list
                summary: "{{fields.label}} — fra {{fields.base}} NOK"
                fields:
                  - { label: "ID",        name: id,    widget: string }
                  - { label: "Navn",      name: label, widget: string }
                  - { label: "Basispris", name: base,  widget: number }
              - label: "Trykkmetoder"
                name: methods
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: "ID",             name: id,    widget: string }
                  - { label: "Navn",           name: label, widget: string }
                  - { label: "Multiplikator",  name: mult,  widget: number }

          - name: arbeidstoy
            label: "Arbeidstøy"
            widget: object
            fields:
              - { label: "Trykk basispris (NOK/stk)", name: printBase, widget: number }
              - label: "Plagg"
                name: items
                widget: list
                summary: "{{fields.label}} — fra {{fields.base}} NOK"
                fields:
                  - { label: "ID",        name: id,    widget: string }
                  - { label: "Navn",      name: label, widget: string }
                  - { label: "Basispris", name: base,  widget: number }
              - label: "Merker"
                name: brands
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: "ID",            name: id,    widget: string }
                  - { label: "Navn",          name: label, widget: string }
                  - { label: "Multiplikator", name: mult,  widget: number }

          - name: trykksaker
            label: "Trykksaker"
            widget: object
            fields:
              - label: "Formater"
                name: formats
                widget: list
                summary: "{{fields.label}} — {{fields.base100}} NOK/100 stk"
                fields:
                  - { label: "ID",               name: id,      widget: string }
                  - { label: "Navn",             name: label,   widget: string }
                  - { label: "Pris per 100 stk", name: base100, widget: number }
              - label: "Papir/finish"
                name: papers
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: "ID",            name: id,    widget: string }
                  - { label: "Navn",          name: label, widget: string }
                  - { label: "Multiplikator", name: mult,  widget: number }

          - name: grafisk
            label: "Grafisk design"
            widget: object
            fields:
              - label: "Prosjekttyper"
                name: projects
                widget: list
                summary: "{{fields.label}} — {{fields.min}}–{{fields.max}} NOK"
                fields:
                  - { label: "ID",       name: id,    widget: string }
                  - { label: "Navn",     name: label, widget: string }
                  - { label: "Pris fra", name: min,   widget: number }
                  - { label: "Pris til", name: max,   widget: number }

          - name: dekor
            label: "Interiørdekor"
            widget: object
            fields:
              - { label: "Startgebyr (NOK)",       name: setup,        widget: number }
              - { label: "Montering per m² (NOK)",  name: installation, widget: number }
              - label: "Materialer"
                name: materials
                widget: list
                summary: "{{fields.label}} — {{fields.pricePerM2}} NOK/m²"
                fields:
                  - { label: "ID",          name: id,         widget: string }
                  - { label: "Navn",        name: label,      widget: string }
                  - { label: "Pris per m²", name: pricePerM2, widget: number }

          - name: bilfoliering
            label: "Bilfoliering"
            widget: object
            fields:
              - { label: "Foliepris per m² (NOK)",     name: pricePerM2,   widget: number }
              - { label: "Monteringspris per m² (NOK)", name: installPerM2, widget: number }
              - label: "Kjøretøytyper"
                name: vehicles
                widget: list
                summary: "{{fields.label}} — {{fields.fullArea}} m²"
                fields:
                  - { label: "ID",               name: id,       widget: string }
                  - { label: "Navn",             name: label,    widget: string }
                  - { label: "Fullt areal (m²)", name: fullArea, widget: number }

          - name: messe
            label: "Messeutstyr"
            widget: object
            fields:
              - label: "Utstyr"
                name: items
                widget: list
                summary: "{{fields.label}} — {{fields.min}}–{{fields.max}} NOK"
                fields:
                  - { label: "ID",       name: id,    widget: string }
                  - { label: "Navn",     name: label, widget: string }
                  - { label: "Pris fra", name: min,   widget: number }
                  - { label: "Pris til", name: max,   widget: number }

  # ── PROFILKLÆR KATALOG ─────────────────────────────────────────────────────
  - name: "catalog"
    label: "Profilklær"
    files:
      - name: "products"
        label: "Alle produkter"
        file: "data/catalog.json"
        fields:
          - name: products
            label: Produkter
            label_singular: Produkt
            widget: list
            summary: "{{fields.name}} — {{fields.price}} kr"
            fields:
              - { label: "ID",    name: id,    widget: string, hint: "Unik kode, f.eks. u-tshirt-2" }
              - { label: "Navn",  name: name,  widget: string }
              - label: "Kategori"
                name: category
                widget: select
                options:
                  - { label: "Topper (t-skjorter, hettegensere)",  value: "topper"   }
                  - { label: "Jakker",                              value: "jakker"   }
                  - { label: "Bukser",                              value: "bukser"   }
                  - { label: "Caps",                                value: "caps"     }
                  - { label: "Tilbehør",                            value: "tilbehor" }
              - { label: "Pris fra (NOK)", name: price, widget: number, value_type: int }
              - label: "Plaggtype (for mockup)"
                name: garment
                widget: select
                options:
                  - { label: "T-skjorte", value: "tshirt" }
                  - { label: "Polo",      value: "polo"   }
                  - { label: "Hoodie",    value: "hoodie" }
                  - { label: "Jakke",     value: "jakke"  }
                  - { label: "Bukse",     value: "bukse"  }
                  - { label: "Caps",      value: "caps"   }
                  - { label: "Ingen",     value: ""       }
              - label: "Bilde"
                name: img
                widget: image
                choose_url: true
                hint: "Last opp eller lim inn URL"
              - label: "Tilgjengelige farger (hex)"
                name: colors
                widget: list
                field:
                  label: "Farge"
                  name: color
                  widget: color

  # ── INNSTILLINGER ──────────────────────────────────────────────────────────
  - name: "settings"
    label: "Nettstedsinnstillinger"
    files:
      - name: "contact"
        label: "Kontaktinformasjon"
        file: "data/settings.json"
        fields:
          - { label: "Telefon",         name: phone,   widget: string }
          - { label: "E-post",          name: email,   widget: string }
          - { label: "Adresse",         name: address, widget: string }
          - { label: "Åpningstider",    name: hours,   widget: string }
          - { label: "Facebook URL",    name: facebook, widget: string }
          - { label: "Instagram URL",   name: instagram, widget: string }
