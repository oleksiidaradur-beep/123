# Netlify configuration for Opsis AS

[build]
  publish = "."   # serve the root folder as-is (no build step needed)

# Redirect /admin to the CMS
[[redirects]]
  from = "/admin"
  to   = "/admin/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
